openapi: 3.1.0
info:
  title: NebulaPalooza Festival API
  description: REST API for the NebulaPalooza 2026 festival data — venues, performers, and programme events.
  version: 1.0.0
  contact:
    name: NebulaPalooza Team

servers:
  - url: https://api.nebulapalooza.cz
    description: Production server
  - url: http://localhost:8080
    description: Local development

paths:

  /api/festival:
    get:
      summary: Get festival identity and overview
      operationId: getFestival
      responses:
        "200":
          description: Festival identity, ticket options, and API links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Festival"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/venues:
    get:
      summary: List all venues
      operationId: getVenues
      responses:
        "200":
          description: Array of all venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/venues/{id}:
    get:
      summary: Get a single venue with its events
      operationId: getVenueById
      parameters:
        - name: id
          in: path
          required: true
          description: Venue ID (e.g. V1)
          schema:
            type: string
            pattern: "^V[0-9]+$"
          example: V1
      responses:
        "200":
          description: Venue detail including list of events held there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/performers:
    get:
      summary: List all performers with pagination
      operationId: getPerformers
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Paginated list of performers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformersList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/performers/{id}:
    get:
      summary: Get a single performer and their events
      operationId: getPerformerById
      parameters:
        - name: id
          in: path
          required: true
          description: Performer ID (e.g. P1)
          schema:
            type: string
            pattern: "^P[0-9]+$"
          example: P18
      responses:
        "200":
          description: Performer detail with list of their scheduled events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformerDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events:
    get:
      summary: List all programme events with filters and pagination
      operationId: getEvents
      parameters:
        - name: day
          in: query
          description: "Filter by festival day (ISO 8601: YYYY-MM-DD)"
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          example: "2026-06-04"
        - name: venueId
          in: query
          description: Filter by venue ID
          schema:
            type: string
            pattern: "^V[0-9]+$"
          example: V1
        - name: performerId
          in: query
          description: Filter by performer ID
          schema:
            type: string
            pattern: "^P[0-9]+$"
          example: P18
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Filtered and paginated list of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events/{id}:
    get:
      summary: Get a single event with full venue and performer details
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID (e.g. E1)
          schema:
            type: string
            pattern: "^E[0-9]+$"
          example: E1
      responses:
        "200":
          description: Full event detail with embedded venue and performer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  responses:
    BadRequest:
      description: Bad request — invalid parameter format
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:  { type: integer }

    TicketOption:
      type: object
      required: [name, price, currency]
      properties:
        name:     { type: string }
        price:    { type: number, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }

    Festival:
      type: object
      required: [id, name, year, location, dates, description, tickets, links]
      properties:
        id:          { type: string }
        name:        { type: string }
        year:        { type: integer, minimum: 2000, maximum: 2099 }
        location:    { type: string }
        dates:       { type: string }
        description: { type: string }
        tickets:
          type: object
          properties:
            dayPass:    { $ref: "#/components/schemas/TicketOption" }
            fullAccess: { $ref: "#/components/schemas/TicketOption" }
        links:
          type: object
          properties:
            venues:     { type: string }
            performers: { type: string }
            events:     { type: string }

    VenueSummary:
      type: object
      required: [id, name, type, link]
      properties:
        id:   { type: string, pattern: "^V[0-9]+$" }
        name: { type: string }
        type:
          type: string
          enum: [Outdoor, "Indoor/Exhibition", Indoor, Mixed]
        link: { type: string }

    VenueDetail:
      type: object
      required: [id, name, type, events]
      properties:
        id:   { type: string, pattern: "^V[0-9]+$" }
        name: { type: string }
        type:
          type: string
          enum: [Outdoor, "Indoor/Exhibition", Indoor, Mixed]
        events:
          type: array
          items:
            type: object
            required: [id, title, day]
            properties:
              id:    { type: string, pattern: "^E[0-9]+$" }
              title: { type: string }
              day:   { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }

    PerformerSummary:
      type: object
      required: [id, name, specialty, link]
      properties:
        id:        { type: string, pattern: "^P[0-9]+$" }
        name:      { type: string }
        specialty: { type: string }
        link:      { type: string }

    PerformersList:
      type: object
      required: [total, page, pageSize, performers]
      properties:
        total:      { type: integer, minimum: 0 }
        page:       { type: integer, minimum: 1 }
        pageSize:   { type: integer, minimum: 1, maximum: 100 }
        performers:
          type: array
          items:
            $ref: "#/components/schemas/PerformerSummary"

    PerformerDetail:
      type: object
      required: [id, name, specialty, events]
      properties:
        id:        { type: string, pattern: "^P[0-9]+$" }
        name:      { type: string }
        specialty: { type: string }
        events:
          type: array
          items:
            type: object
            required: [id, title, day, venueId]
            properties:
              id:      { type: string, pattern: "^E[0-9]+$" }
              title:   { type: string }
              day:     { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
              venueId: { type: string, pattern: "^V[0-9]+$" }

    EventSummary:
      type: object
      required: [id, title, day, venueId, performerId, link]
      properties:
        id:          { type: string, pattern: "^E[0-9]+$" }
        title:       { type: string }
        day:         { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        venueId:     { type: string, pattern: "^V[0-9]+$" }
        performerId: { type: string, pattern: "^P[0-9]+$" }
        link:        { type: string }

    EventsList:
      type: object
      required: [page, pageSize, filters, events]
      properties:
        page:     { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        filters:
          type: object
          properties:
            day:         { type: string }
            venueId:     { type: string }
            performerId: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"

    EventDetail:
      type: object
      required: [id, title, day, venue, performer]
      properties:
        id:    { type: string, pattern: "^E[0-9]+$" }
        title: { type: string }
        day:   { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        venue:
          type: object
          required: [id, name]
          properties:
            id:   { type: string, pattern: "^V[0-9]+$" }
            name: { type: string }
        performer:
          type: object
          required: [id, name, specialty]
          properties:
            id:        { type: string, pattern: "^P[0-9]+$" }
            name:      { type: string }
            specialty: { type: string }
