<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Programme – NebulaPalooza 2026</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">NebulaPalooza 2026</div>
      <nav>
        <a href="custom_list.html" class="active">My Programme</a>
        <a href="index.html">Home</a>
        <a href="programme.html">Programme</a>
        <a href="performers.html">Performers</a>
        <a href="practical.html">Practical Info</a>
        
      </nav>
    </header>

    <main style="max-width: 900px; margin: 4rem auto; padding: 0 1rem;">
      <section style="text-align: center; margin-bottom: 2.5rem;">       
        <h1 style="color: var(--white); margin-top: 0.5rem;">⭐ My Personal Programme</h1>
      </section>

      <!-- For saved events -->
      <section id="favourites-container" style="background: var(--panel); border: 2px solid var(--cyan); border-radius: 12px; padding: 1.5rem;">
        <div id="favourites-list">
    
        </div>
      </section>
    </main>

    <footer>
      <div class="logo">NebulaPalooza 2026</div>
      <nav>
        <a href="custom_list.html" class="active">My Programme</a>
        <a href="index.html">Home</a>
        <a href="programme.html">Programme</a>
        <a href="performers.html">Performers</a>
        <a href="practical.html">Practical Info</a>
      </nav>
      <p>
        Images generated with Gemini and Nano Banana 2
      </p>
    </footer>

    <!-- Script to Load and Match Event Rows -->
    <script>
      function renderCustomList() {
        const container = document.getElementById("favourites-list");
        const favourites = JSON.parse(localStorage.getItem("myFavourites")) || [];

        if (favourites.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 3rem 1rem; color: var(--muted);">
              <p style="font-size: 1.1rem; margin-bottom: 1rem;">No events yet.</p>
              <a href="programme.html" style="color: var(--cyan); text-decoration: underline;">Go to the Programme page to save some!</a>
            </div>
          `;
          return;
        }

        container.innerHTML = "";
        
        // Loop through saved event titles and build rows that match your original page layout
        favourites.forEach((title) => {
          const article = document.createElement("article");
          article.className = "event-row";
          // Re-using the exact grid style from your main programme rows
          article.style.display = "grid";
          article.style.gridTemplateColumns = "90px 1fr auto";
          article.style.alignItems = "center";
          article.style.gap = "var(--gap)";
          article.style.padding = "0.85rem 1rem";
          article.style.borderBottom = "1px solid var(--border)";

          article.innerHTML = `
            <time datetime="2026-06-04" style="color: var(--muted); font-size: 0.9rem;">Saved Event</time>
            <div>
              <h3 style="color: var(--white); margin: 0; font-size: 1.1rem;">${title}</h3>
              <p style="color: var(--muted); margin: 0.2rem 0 0 0; font-size: 0.85rem;">NebulaPalooza 2026 Custom Schedule</p>
            </div>
            <button onclick="removeFavourite('${title}')" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Remove</button>
          `;
          container.appendChild(article);
        });
      }

      function removeFavourite(title) {
        let favourites = JSON.parse(localStorage.getItem("myFavourites")) || [];
        favourites = favourites.filter(item => item !== title);
        localStorage.setItem("myFavourites", JSON.stringify(favourites));
        renderCustomList();
      }

      window.addEventListener("DOMContentLoaded", renderCustomList);
    </script>
  </body>
</html>
